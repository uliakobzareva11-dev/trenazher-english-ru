<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр английского</title>
<meta name="description" content="Тренажёр английского для подготовки к ЕГЭ: чтение вслух с озвучкой, грамматика и словообразование в формате ЕГЭ.">
<style>
  :root{ --bg:#fbfbfa; --ink:#1a1a1a; --muted:#6b6b6b; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#16181a; --ink:#ececea; --muted:#9a9a97; } }
  body{margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px}
  .wait{color:var(--muted)}
</style>
</head>
<body>
<p class="wait">Открываю тренажёр…</p>
<script>
// Две версии тренажёра. Открытая (чтение и звуки + одна тема ЕГЭ) лежит прямо здесь.
// Полная зашифрована в polny.txt и открывается только кодом из личной ссылки.
const D = /*DANNYE*/null;
const OTKRYTO = /*OTKRYTO*/"";
const LS = "trenazher-dostup";
const enc = new TextEncoder();
const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = (u, n) => Array.from(u.slice(0, n), x => x.toString(16).padStart(2, "0")).join("");
const sha = async s => new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(s)));
const chist = k => (k || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const napisat = html => { document.open(); document.write(html); document.close(); };

async function polnaya(kod){
  const v = D.v[hex(await sha("id:" + kod), 8)];
  if(!v) return null;
  try{
    const P = await (await fetch("polny.txt?" + D.sb, {cache:"no-store"})).json();
    const base = await crypto.subtle.importKey("raw", enc.encode(kod), "PBKDF2", false, ["deriveKey"]);
    const kk = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(v[0]), iterations:D.it, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const syroy = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(v[1])}, kk, b(v[2]));
    const kluch = await crypto.subtle.importKey("raw", syroy, "AES-GCM", false, ["decrypt"]);
    let html = new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM", iv:b(P.iv)}, kluch, b(P.s)));
    // метка ученика в Метрике: одна ссылка на многих устройствах = ссылку передали
    const m = hex(await sha("metka:" + kod), 4);
    return html.replace("</body>", "<script>try{ym(" + D.m + ",'userParams',{dostup:'" + m + "'})}catch(e){}<\/script></body>");
  }catch(e){ return null; }
}

// document.write заменяет страницу, только когда браузер её дочитал, иначе дописывает снизу — ждём DOMContentLoaded
async function start(){
  let kod = chist(decodeURIComponent(location.hash.slice(1)));
  let izPamyati = false;
  if(!kod){ try{ kod = chist(localStorage.getItem(LS)); izPamyati = true; }catch(e){} }
  if(kod){
    const html = await polnaya(kod);
    if(html){
      try{ localStorage.setItem(LS, kod); }catch(e){}
      if(location.hash) history.replaceState(null, "", location.pathname + location.search);
      return napisat(html);
    }
    try{ localStorage.removeItem(LS); }catch(e){}
    if(location.hash) history.replaceState(null, "", location.pathname + location.search);
    const t = izPamyati ? "Ваша ссылка больше не открывает полный тренажёр, возможно, закончилась подписка. Открыта бесплатная часть."
                        : "Код не подходит, проверьте ссылку. Открыта бесплатная часть.";
    return napisat(OTKRYTO.replace("<body>", "<body><div onclick=\"this.remove()\" style=\"background:#8c3b2f;color:#fff;" +
      "padding:12px 16px;font:15px/1.4 system-ui,sans-serif;cursor:pointer\">" + t + " ✕</div>"));
  }
  napisat(OTKRYTO);
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
</script>
</body>
</html>
